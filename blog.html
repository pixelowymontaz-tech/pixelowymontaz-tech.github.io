<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.country.is; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title data-i18n-title="blog.meta">Log — MOVO</title>
  <meta name="description" content="Every post from building the MOVO 360° camera." />
  <link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <meta name="theme-color" content="#f4f4f3" />
  <meta property="og:title" content="Log — MOVO" />
  <meta property="og:description" content="Every post from building the MOVO 360° camera." />
  <meta property="og:image" content="https://pixelowymontaz-tech.github.io/assets/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700;800&family=Poppins:wght@800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tw.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="flex min-h-screen flex-col font-sans text-neutral-950 antialiased selection:bg-black selection:text-white">
  <div data-progress class="fixed inset-x-0 top-0 z-[60] h-[2px] origin-left scale-x-0 bg-black" aria-hidden="true"></div>

  <header class="fixed inset-x-0 top-3 z-50 px-3 sm:top-5">
    <nav class="glass glass-nav mx-auto flex max-w-xl items-center justify-between rounded-full py-2 pl-5 pr-2 text-sm">
      <a href="index.html" class="logo text-base">MOVO</a>
      <div class="flex items-center gap-1">
        <button type="button" data-lang-toggle class="rounded-full px-2.5 py-1.5 font-medium text-neutral-600 transition hover:bg-white/60 hover:text-black">PL</button>
        <a href="index.html" data-i18n="nav.back" class="rounded-full px-3 py-1.5 text-neutral-600 transition hover:bg-white/60 hover:text-black">← back</a>
      </div>
    </nav>
  </header>

  <main class="relative flex-1 overflow-hidden">
    <div class="pointer-events-none absolute -right-32 top-10 aspect-square w-[80vw] max-w-[620px] rounded-full border border-black/10" aria-hidden="true"></div>

    <section class="relative mx-auto max-w-6xl px-4 pb-24 pt-32 sm:px-6 md:pt-40 lg:px-8">
      <h1 data-i18n="blog.title" class="reveal font-display text-6xl font-extrabold tracking-tighter sm:text-8xl">Log</h1>
      <p class="reveal mt-6 max-w-lg text-lg leading-relaxed text-neutral-600">
        <span data-i18n="blog.lead">Everything in order: what I did, what didn't work and what's next. Posts:</span> <span data-post-count>0</span>.
      </p>
      <div data-posts class="mt-14 border-b border-black/10"></div>
    </section>
  </main>

  <footer class="bg-black px-4 py-10 text-white sm:px-6 lg:px-8">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 text-sm">
      <a data-mail data-u="movo.contact" data-d="gmail.com" href="index.html#contact" class="font-display text-lg font-bold hover:text-neutral-400">e-mail</a>
      <span class="text-xs text-neutral-500">© <span data-year></span> Ignacy · <span class="logo">MOVO</span></span>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
